spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes[0]:
        id: user-microservice
        uri: lb://USER-MICROSERVICE
        predicates[0]: Path=/auth/**, /api/**
      routes[1]:
        id: meal-microservice
        uri: lb://MEAL-MICROSERVICE
        predicates[0]: Path=/api/**
      routes[2]:
        id: ingredient-microservice
        uri: lb://INGREDIENT-MICROSERVICE
        predicates[0]: Path=/api/**

    loadbalancer:
      ribbon:
        enabled: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    instance-id: ${spring.application.name}:${random.uuid}